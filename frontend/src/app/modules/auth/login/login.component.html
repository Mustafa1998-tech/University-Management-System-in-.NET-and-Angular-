<div class="login-shell">
  <div class="login-card">
    <header class="brand">
      <div class="logo">UM</div>
      <h1>University System</h1>
      <p>Sign in with your account</p>
    </header>

    <form [formGroup]="form" (ngSubmit)="submit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          type="email"
          id="email"
          formControlName="email"
          class="form-control"
          placeholder="Email"
          [class.is-invalid]="form.get('email')?.invalid && form.get('email')?.touched"
        />
        <div *ngIf="form.get('email')?.invalid && form.get('email')?.touched" class="error-message">
          <span *ngIf="form.get('email')?.errors?.['required']">Email is required</span>
          <span *ngIf="form.get('email')?.errors?.['email']">Please enter a valid email</span>
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          formControlName="password"
          class="form-control"
          placeholder="Password"
          [class.is-invalid]="form.get('password')?.invalid && form.get('password')?.touched"
        />
        <div *ngIf="form.get('password')?.invalid && form.get('password')?.touched" class="error-message">
          <span *ngIf="form.get('password')?.errors?.['required']">Password is required</span>
        </div>
      </div>

      <a class="forgot-link" href="#">Forgot password?</a>

      <button type="submit" class="login-btn" [disabled]="loading || form.invalid">
        <span *ngIf="!loading">Login</span>
        <span *ngIf="loading" class="loading-spinner">
          <span class="spinner"></span>
          Signing in...
        </span>
      </button>

      <div *ngIf="error" class="error-alert">
        {{ error }}
      </div>
    </form>
  </div>
</div>
